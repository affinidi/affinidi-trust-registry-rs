[package]
name = "test-trust-registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Embedded Trust Registry fixture for integration tests — spawn() an in-process server on an ephemeral port."
readme = "README.md"
publish = false

[features]
default = []
# Wire the DIDComm Trust Task listener against an affinidi-messaging-test-mediator.
# `trql-client/didcomm` is for the tests that query through the real client.
mediator = [
    "dep:affinidi-messaging-test-mediator",
    "dep:affinidi-tdk",
    "dep:trql-client",
    "trql-client/didcomm",
    "dep:tempfile",
]
# Additionally start (and exercise) the TSP Trust Task receive loop.
tsp = [
    "mediator",
    "trust-registry/tsp",
    "affinidi-messaging-test-mediator/tsp",
    "trql-client/tsp",
]

[dependencies]
trust-registry = { path = "../trust-registry", version = "0.32.0" }

tokio.workspace = true
tokio-util.workspace = true

affinidi-messaging-test-mediator = { version = "0.50.0", optional = true }
affinidi-tdk = { workspace = true, optional = true }
# A per-spawn messaging store directory for mediator-wired registries.
tempfile = { workspace = true, optional = true }
# Only so the `mediator` / `tsp` features can switch on the client's mediator
# transports for the tests (a feature cannot name a dev-dependency's feature).
# The fixture's own code does not use it.
trql-client = { path = "../trql-client", version = "0.32.0", default-features = false, optional = true }

[dev-dependencies]
# The tests query the registry through the real client (HTTPS always; DIDComm
# and TSP with the features above).
trql-client = { path = "../trql-client", version = "0.32.0" }
reqwest.workspace = true
serde_json.workspace = true
# Client side of the routed Trust Task round-trip (mediator/tsp tests).
affinidi-tdk.workspace = true
affinidi-messaging-sdk.workspace = true
trust-tasks-rs.workspace = true
trust-tasks-didcomm.workspace = true
trust-tasks-tsp.workspace = true
trust-tasks-proof.workspace = true
chrono.workspace = true
uuid.workspace = true

[lints]
workspace = true
