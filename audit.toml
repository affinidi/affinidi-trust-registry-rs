[advisories]
# Ignore advisories for specific vulnerabilities
# TODO: align pipeline in order to keep ignored vulnerabilities only there.
# Add RUSTSEC IDs here as needed:
ignore = [
	"RUSTSEC-2022-0040",
	"RUSTSEC-2023-0071",
	"RUSTSEC-2024-0373",
	"RUSTSEC-2026-0098",
	"RUSTSEC-2026-0099",
	"RUSTSEC-2026-0104",
	# transitive h2 0.3.27 via aws-smithy-http-client's hyper 0.14 path: a
	# server-side DoS in an h2 we only ever drive as a client, and no fix until
	# the AWS SDK moves off hyper 0.14.
	"RUSTSEC-2026-0258",
]

# Warn instead of error for these severity levels
# Options: "none", "low", "medium", "high", "critical"
# severity-threshold = "medium"

[licenses]
# Don't check licenses (handled by cargo-deny)
unlicensed = "allow"
allow = []
deny = []

[bans]
# Multiple versions of the same crate
multiple-versions = "allow"

[sources]
# Warn for crates from unknown sources
unknown-registry = "warn"
unknown-git = "warn"
