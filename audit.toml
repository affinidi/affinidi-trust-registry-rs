[advisories]
# Empty, and worth keeping that way. Every entry that used to live here was a
# transitive advisory reached through the AWS SDK's legacy hyper-0.14 client;
# declining that connector in the workspace Cargo.toml removed the vulnerable
# crates from the graph outright, so there is nothing left to suppress.
ignore = []

# Warn instead of error for these severity levels
# Options: "none", "low", "medium", "high", "critical"
# severity-threshold = "medium"

[licenses]
# Don't check licenses (handled by cargo-deny)
unlicensed = "allow"
allow = []
deny = []

[bans]
# Multiple versions of the same crate
multiple-versions = "allow"

[sources]
# Warn for crates from unknown sources
unknown-registry = "warn"
unknown-git = "warn"
