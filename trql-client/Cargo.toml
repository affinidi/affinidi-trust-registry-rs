[package]
name = "trql-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Transport-agnostic Trust Registry query client (TRQP over Trust Tasks): HTTPS, DIDComm, TSP"
readme = "README.md"
license.workspace = true
homepage.workspace = true
# The protocol is TRQP; `trql` is only part of this crate's name, not a
# separate protocol, so it is not a keyword.
keywords = ["trust-registry", "trqp", "trust-tasks", "didcomm", "tsp"]
repository.workspace = true

publish = true

[features]
default = ["https"]
# HTTPS binding: POST /trust-tasks (trust-tasks-https wire contract).
# tokio resolves host names for the optional non-public address filter.
https = ["dep:reqwest", "dep:tokio"]
# DIDComm binding over the ATM mediator (trust-tasks-didcomm envelope).
didcomm = [
    "dep:affinidi-tdk",
    "dep:affinidi-messaging-core",
    "dep:trust-tasks-didcomm",
    "dep:tokio",
]
# TSP binding, multiplexed on the same mediator websocket (trust-tasks-tsp
# envelope). Mirrors the trust-registry `tsp` feature: affinidi-tsp is a moving
# 0.x dependency, so this stays opt-in.
tsp = [
    "dep:affinidi-tdk",
    "dep:affinidi-messaging-sdk",
    "dep:affinidi-messaging-core",
    "dep:trust-tasks-tsp",
    "dep:tokio",
    "affinidi-tdk/tsp",
    "affinidi-messaging-sdk/tsp",
]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
trust-tasks-rs.workspace = true
# Document ids are `urn:uuid:` + a random (v4) UUID in every build.
uuid.workspace = true

# https
reqwest = { workspace = true, optional = true }

# didcomm / tsp
affinidi-tdk = { workspace = true, optional = true }
affinidi-messaging-sdk = { workspace = true, optional = true }
# `ConnState`, the websocket connection state the SDK reports (not re-exported
# by the SDK); the same release the SDK depends on.
affinidi-messaging-core = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
trust-tasks-didcomm = { workspace = true, optional = true }
trust-tasks-tsp = { workspace = true, optional = true }

[build-dependencies]
trust-tasks-build.workspace = true

[dev-dependencies]
axum.workspace = true
tokio.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
# Render the DIDComm and TSP transports too, not only the default HTTPS one.
all-features = true
