name: Nightly

# Advances `nightly` to the newest main commit whose full checks.yaml run
# passed (RELEASES.md). main merges on a red suite as readily as a green one, so its
# tip is not something to cut a release from; `nightly` is: a fast-forward-only
# pointer that moves only to a commit every CI job passed on.
#
# Read from each run's own jobs, not the run's conclusion: the rollup reports
# a re-run's staleness as success.
#
# Moved with GITHUB_TOKEN: nothing triggers on a push to `nightly`, so the
# token's no-workflows rule costs nothing here.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  advance:
    name: Advance nightly to the last green main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: affinidi/pipeline-rust/.github/actions/release-nightly@feat/release-branch-actions
        with:
          workflow: checks.yaml
