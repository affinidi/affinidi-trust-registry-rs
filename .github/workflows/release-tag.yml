name: Tag a release

# A push to a release branch that moves RELEASE (the cut, or a merged prep PR)
# tags `v<RELEASE>` and opens its GitHub Release (RELEASES.md). An rc
# (`vX.Y.Z-rc.N`) is a prerelease and never "latest". Its notes are the
# version's CHANGELOG.md section where it has one, otherwise generated.
#
# The tag is created with the release-bot GitHub App's token: the
# `tags_managed` ruleset only lets that app (and admins) create tags, so
# GITHUB_TOKEN would be refused.
#
# Crates are published by release.yaml on the same push (GA and patch only).
on:
  push:
    branches: ["release/**"]
    paths: [RELEASE]

permissions:
  contents: read

concurrency:
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag v<RELEASE>
    # The release-bot app's secrets live in the `release` environment (as they
    # did for pipeline-rust's release job), not at repository level. Its branch
    # policy admits `main` and `release/*`, and it has no required reviewers.
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
      - uses: affinidi/pipeline-rust/.github/actions/release-tag@feat/release-branch-actions
        with:
          token: ${{ steps.app-token.outputs.token }}
