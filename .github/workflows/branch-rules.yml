name: Branch rules

# Where a PR may go and what it may change: fixes reach a release branch by
# backport, only the release tooling edits versions and RELEASE, and a cut,
# prep or backport PR counts as one only when the release bot opened it. See
# RELEASES.md.
#
# Its own workflow for the trigger: `labeled` / `unlabeled` must re-run it (the
# `release-direct` label changes the verdict), and adding those to ci.yml would
# rebuild the world on every label. It is not part of nightly's gate: it
# only ever runs on PRs. Seconds, no build.
on:
  pull_request:
    branches: [main, "release/**"]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  rules:
    name: branch rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The action's default release-bot, affinidi-semantic-release[bot], is this repository's app.
      - uses: affinidi/pipeline-rust/.github/actions/release-branch-rules@feat/release-branch-actions
        with:
          # Transitional: also accepts a maintainer's local cut or prep PR; drop it once both use the release workflows.
          maintainer-releases: "true"
