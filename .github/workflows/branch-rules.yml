name: Branch rules

# Where a PR may go and what it may change: fixes reach a release branch by
# backport, only the release tooling edits versions and RELEASE, and a cut,
# prep or backport PR counts as one only when the release bot opened it. See
# RELEASES.md.
#
# Its own workflow for the trigger: `labeled` / `unlabeled` must re-run it (the
# `release-direct` label changes the verdict), and adding those to ci.yml would
# rebuild the world on every label. It is not part of nightly's gate: it
# only ever runs on PRs. Seconds, no build.
on:
  pull_request:
    branches: [main, "release/**"]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read  # who added release-direct

jobs:
  rules:
    name: branch rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: affinidi/pipeline-rust/.github/actions/release-branch-rules@2bbccfe101c0261cc9ee2252383bc62cb00cd469 # main, 2026-11-09
        with:
          # Also accepts a maintainer's local cut or prep PR (scripts/cut-release.py).
          # Set to "false" when that script is deleted: once a release has been
          # cut with release-cut.yml (RELEASES.md, "Cut").
          maintainer-releases: "true"
