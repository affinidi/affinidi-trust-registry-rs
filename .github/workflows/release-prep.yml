name: Prepare a release

# Opens the PR that prepares the next rc, GA or patch of a release
# (RELEASES.md). Run it from the Actions tab with the release branch selected
# as the ref. Merging the PR it opens is the release: release-tag.yml tags it,
# release.yaml publishes the crates for a GA or patch.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "rc (next candidate), ga (rc.N -> .0) or patch (.N -> .N+1)"
        required: true
        type: choice
        options: [patch, rc, ga]

permissions:
  contents: read

concurrency:
  group: release-prep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare ${{ inputs.kind }} on ${{ github.ref_name }}
    # The release-bot app's secrets live in the `release` environment (as they
    # did for pipeline-rust's release job), not at repository level. Its branch
    # policy admits `main` and `release/*`, and it has no required reviewers.
    environment: release
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # The release-bot app's token: the enterprise does not allow GITHUB_TOKEN
      # to open pull requests, and one it opened would run no CI (RELEASES.md).
      - uses: affinidi/pipeline-rust/.github/actions/release-prep@feat/release-branch-actions
        with:
          kind: ${{ inputs.kind }}
          token: ${{ steps.app-token.outputs.token }}
          # cargo runs `cargo update -w` after a patch's version bump.
          toolchain: '1.96.0'
