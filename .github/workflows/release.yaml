name: release

# THE FILENAME OF THIS FILE IS LOAD-BEARING. crates.io Trusted Publishing is
# configured per crate against a repository + workflow FILENAME (+ the
# `release` environment below). trust-registry, trqp and trql-client are
# registered against `affinidi/affinidi-trust-registry-rs`, `release.yaml`,
# environment `release` — the file that published from main before
# RELEASES.md. Renaming it makes the OIDC exchange fail before anything
# publishes.
#
# Publishes the workspace to crates.io from a release branch (RELEASES.md):
#
#   * only when RELEASE exists (release branches only), names a GA or patch
#     version (`X.Y.Z`; an rc publishes nothing), and equals the workspace
#     version — a mismatch fails the run rather than publishing the wrong thing;
#   * only crates whose version is not already on crates.io (read from the
#     sparse index), so a push that changes nothing — a backport before its
#     prep PR — is a no-op, and a re-run resumes where a failed one stopped;
#   * in dependency order (derived from `cargo metadata`), waiting for each
#     crate to reach the index before its dependents are verified.
#
# The publishing itself is pipeline-rust's release-publish action, run inside
# this job so the Trusted Publishing identity stays this file and environment.
#
# main no longer publishes: it carries the next release's version.
#
# Trusted Publishing ONLY: no CARGO_REGISTRY_TOKEN secret, no fallback to one.
# Each crate is verify-built with no token in existence, then uploaded with a
# token minted for it alone and revoked afterwards, so the 30-minute token
# lifetime never cuts a release short. A failed upload is retried on a new
# token; a verify-build failure is not. The run fails unless every crate is on
# crates.io.
#
# A brand-new crate cannot be published this way (RELEASES.md, "A new crate").

on:
  push:
    branches: ["release/**"]
  # Recovery hatch: re-run the same logic (e.g. after fixing a crates.io-side
  # Trusted Publisher config). Choose the release branch as the ref.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never two publishers on one branch; never cancel one mid-release.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 180
    permissions:
      # OIDC token exchange with crates.io (Trusted Publishing).
      id-token: write
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: affinidi/pipeline-rust/.github/actions/release-publish@feat/release-branch-actions
        with:
          toolchain: '1.96.0'
          # Deliberately without `-D warnings`: CI already holds the code to that,
          # and failing a real release half-way through on a lint that appeared
          # upstream since helps nobody.
          rustflags: '--cfg tracing_unstable'
          ubuntu-rust-deps: build-essential libdbus-1-dev libssl-dev
          build-jobs: '4'
