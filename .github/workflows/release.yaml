name: release

on:
  push:
    branches:
      - main

jobs:
  rust-pipeline:
    uses: affinidi/pipeline-rust/.github/workflows/release.yaml@main
    secrets: inherit
    with:
      toolchain: '1.96.0'
      rustflags: "-D warnings --cfg tracing_unstable"
      release_debug: true
      release_dry_run: false
