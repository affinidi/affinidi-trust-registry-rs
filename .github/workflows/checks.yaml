name: checks

# The whole suite lives in this one file on purpose: nightly.yml advances
# `nightly` only to a main commit on which EVERY job of this workflow passed
# (RELEASES.md), so a check kept in a separate workflow would be invisible to
# that gate. Hence the `push` trigger: the run on main is the build-of-record
# nightly.yml reads.
on:
  push:
    branches: [main, "release/**"]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

# Supersede a PR's in-flight run when new commits land on the same ref.
# Deliberately NOT cancelled for `push`: cancelling a run on main leaves that
# commit without a green run, so nightly can never advance to it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only unless a job asks for more.
permissions:
  contents: read

jobs:
  rust-pipeline:
    uses: affinidi/pipeline-rust/.github/workflows/checks-no-test.yaml@2bbccfe101c0261cc9ee2252383bc62cb00cd469 # main, 2026-11-09
    # The ceiling for the reusable workflow's jobs. GitHub checks every
    # nested job's request at startup, even one its `if:` skips: `audit`
    # files RustSec issues (issues: write) and `deprecation-check`, off
    # here, comments on PRs (pull-requests: write).
    permissions:
      contents: read
      issues: write
      pull-requests: write
    # Only the secrets the reusable workflow declares, not every secret.
    secrets:
      SNYK_SCANNER_TOKEN: ${{ secrets.SNYK_SCANNER_TOKEN }}
      SNYK_SCANNER_REGION: ${{ secrets.SNYK_SCANNER_REGION }}
      SNYK_GLOBAL_POLICY: ${{ secrets.SNYK_GLOBAL_POLICY }}
    with:
      toolchain: '1.96.0'
      rustflags: '-D warnings --cfg tracing_unstable'
  guards:
    # Cheap, build-free guards that protect the release pipeline: lockstep
    # versions, CHANGELOG / RELEASE consistency.
    name: release guards
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: affinidi/pipeline-rust/.github/actions/release-guards@2bbccfe101c0261cc9ee2252383bc62cb00cd469 # main, 2026-11-09
  semver:
    # Patch releases must be semver-compatible. Every PR into a release branch
    # (a backport, a `release-direct` fix, a prep PR) is checked against the
    # branch tip it merges into — not against crates.io, whose newest version
    # may belong to a later release line.
    name: semver (patch-compatible)
    if: github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # Rustdoc JSON for the baseline and the PR; warnings are not this job's
      # concern (the rust-pipeline checks own them).
      RUSTFLAGS: '--cfg tracing_unstable'
      RUSTDOCFLAGS: '--cfg tracing_unstable'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: '1.96.0'
          rustflags: '--cfg tracing_unstable'
      - uses: affinidi/pipeline-rust/.github/actions/rust-dependencies@2bbccfe101c0261cc9ee2252383bc62cb00cd469 # main, 2026-11-09
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-semver-checks@0.51.0
      - name: cargo semver-checks --release-type patch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          cargo semver-checks --workspace \
            --release-type patch \
            --baseline-rev "$BASE_SHA"
  test:
    name: Test Suite
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # Read by trust-registry/tests/didcomm_integration_test.rs (longer waits).
      IN_PIPELINE: 'true'
      MEDIATOR_DID: ${{ vars.MEDIATOR_DID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # No `ref:`: a pull_request run tests the PR merged into its base
        # (from a fork too); a push run tests the pushed commit.
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ''
          toolchain: '1.96.0'
          override: true
      - uses: affinidi/pipeline-rust/.github/actions/rust-dependencies@2bbccfe101c0261cc9ee2252383bc62cb00cd469 # main, 2026-11-09
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: 'rust-cache'
      - name: generate configs
        run: |
          # The tests run as the test identities in .env.test; the registry
          # identity this also writes to .env is replaced by `cp .env.test .env`.
          cargo run --bin setup-trust-registry --features dev-tools -p trust-registry -- \
            --mediator-did="$MEDIATOR_DID" \
            --did-method=peer \
            --with-test-identities \
            --test-in-pipeline \
            --non-interactive \
            --file-storage-path=trust-registry/tests/tmp/data.csv
      - name: Prepare test data
        run: |
          mkdir -p trust-registry/tests/tmp
          cp sample-data/data.csv trust-registry/tests/tmp/data.csv
      - name: Run trust-registry server
        run: |
          # setup-trust-registry wrote the generated keys to .env.test
          # (from the tracked .env.pipeline template).
          cp .env.test .env
          RUST_LOG=info nohup cargo run --bin trust-registry > server.log 2>&1 &
          echo $! > server.pid
      - name: Wait for server to be ready
        run: |
          timeout 240 bash -c 'until curl -f http://127.0.0.1:3233/health 2>/dev/null; do sleep 2; done' || (
            echo "Server failed to start. Logs:"
            cat server.log
            exit 1
          )
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-llvm-cov
      - name: Generate code coverage
        run: |
          tail -n +1 -f server.log &
          TAIL_PID=$!
          trap 'kill $TAIL_PID 2>/dev/null || true' EXIT
          cargo llvm-cov --all-features -p trust-registry --summary-only --fail-under-lines=45
      - name: Test library crates
        run: cargo test --all-features -p trql-client -p trqp
      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi
