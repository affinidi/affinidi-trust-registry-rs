name: checks

# The whole suite lives in this one file on purpose: nightly.yml advances
# `nightly` only to a main commit on which EVERY job of this workflow passed
# (RELEASES.md), so a check kept in a separate workflow would be invisible to
# that gate. Hence the `push` trigger: the run on main is the build-of-record
# nightly.yml reads.
on:
  push:
    branches: [main, "release/**"]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

# Supersede a PR's in-flight run when new commits land on the same ref.
# Deliberately NOT cancelled for `push`: cancelling a run on main leaves that
# commit without a green run, so nightly can never advance to it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only unless a job asks for more.
permissions:
  contents: read

jobs:
  rust-pipeline:
    uses: affinidi/pipeline-rust/.github/workflows/checks-no-test.yaml@2bbccfe101c0261cc9ee2252383bc62cb00cd469 # main, 2026-11-09
    # The ceiling for the reusable workflow's jobs. GitHub checks every
    # nested job's request at startup, even one its `if:` skips: `audit`
    # files RustSec issues (issues: write) and `deprecation-check`, off
    # here, comments on PRs (pull-requests: write).
    permissions:
      contents: read
      issues: write
      pull-requests: write
    # Only the secrets the reusable workflow declares, not every secret.
    secrets:
      SNYK_SCANNER_TOKEN: ${{ secrets.SNYK_SCANNER_TOKEN }}
      SNYK_SCANNER_REGION: ${{ secrets.SNYK_SCANNER_REGION }}
      SNYK_GLOBAL_POLICY: ${{ secrets.SNYK_GLOBAL_POLICY }}
    with:
      toolchain: '1.96.0'
      rustflags: '-D warnings'
  guards:
    # Cheap, build-free guards that protect the release pipeline: lockstep
    # versions, CHANGELOG / RELEASE consistency.
    name: release guards
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: affinidi/pipeline-rust/.github/actions/release-guards@2bbccfe101c0261cc9ee2252383bc62cb00cd469 # main, 2026-11-09
  semver:
    # Patch releases must be semver-compatible. Every PR into a release branch
    # (a backport, a `release-direct` fix, a prep PR) is checked against the
    # branch tip it merges into — not against crates.io, whose newest version
    # may belong to a later release line.
    name: semver (patch-compatible)
    if: github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # Rustdoc JSON for the baseline and the PR; warnings are not this job's
      # concern (the rust-pipeline checks own them).
      RUSTFLAGS: ''
      RUSTDOCFLAGS: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: '1.96.0'
          rustflags: ''
      - uses: affinidi/pipeline-rust/.github/actions/rust-dependencies@2bbccfe101c0261cc9ee2252383bc62cb00cd469 # main, 2026-11-09
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-semver-checks@0.51.0
      - name: cargo semver-checks --release-type patch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          cargo semver-checks --workspace \
            --release-type patch \
            --baseline-rev "$BASE_SHA"
  lint:
    # The pipeline-rust checks lint the default features and targets only.
    # This holds every crate, feature combination, test and binary to
    # `-D warnings`, and the docs to rustdoc's lints.
    name: lint (all features, targets and docs)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      RUSTFLAGS: '-D warnings'
      RUSTDOCFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: '1.96.0'
          components: clippy
          rustflags: '-D warnings'
      - uses: affinidi/pipeline-rust/.github/actions/rust-dependencies@2bbccfe101c0261cc9ee2252383bc62cb00cd469 # main, 2026-11-09
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: 'rust-cache-lint'
      - name: clippy, whole workspace, all features and targets
        run: cargo clippy --locked --workspace --all-features --all-targets --no-deps
      - name: clippy, feature combinations
        run: |
          set -euo pipefail
          lint() { echo "::group::cargo clippy $*"; cargo clippy --locked --no-deps --all-targets "$@"; echo "::endgroup::"; }
          # trql-client: each transport on its own, and none.
          lint -p trql-client --no-default-features
          lint -p trql-client --no-default-features --features didcomm
          lint -p trql-client --no-default-features --features tsp
          # trust-registry: the documented embedding build, and each opt-in
          # feature over the defaults.
          lint -p trust-registry --no-default-features
          lint -p trust-registry --no-default-features --features storage-fjall
          lint -p trust-registry --features tsp
          lint -p trust-registry --features vta
          lint -p trust-registry --features dev-tools
          # test-trust-registry: the plain fixture and the mediator-wired one.
          lint -p test-trust-registry
          lint -p test-trust-registry --features mediator
      - name: rustdoc
        run: cargo doc --locked --workspace --no-deps --all-features
      - name: shellcheck
        run: shellcheck testing/run_tests.sh trust-registry/docker/healthcheck.sh
      - name: README states the declared rust-version
        run: |
          set -euo pipefail
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          grep -qF "(currently ${msrv})" README.md || {
            echo "::error file=README.md::README's Requirements section does not say rust-version ${msrv} (Cargo.toml)"
            exit 1
          }
  msrv:
    # The workspace must build on the rust-version it declares, not only on
    # the toolchain CI lints with.
    name: msrv (declared rust-version)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          rustflags: ''
      - uses: affinidi/pipeline-rust/.github/actions/rust-dependencies@2bbccfe101c0261cc9ee2252383bc62cb00cd469 # main, 2026-11-09
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: 'rust-cache-msrv'
      - name: cargo check on the declared rust-version
        run: cargo check --locked --workspace --all-features --all-targets
  docker:
    # Builds the image as `docker compose up --build` does and checks the
    # container comes up healthy (REST only, CSV sample data).
    name: docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the image
        env:
          DOCKER_BUILDKIT: '1'
        run: docker build -f trust-registry/Dockerfile -t trust-registry:ci .
      - name: Start it and wait for /health
        run: |
          set -euo pipefail
          docker run -d --name tr -p 127.0.0.1:3232:3232 \
            -e LISTEN_ADDRESS=0.0.0.0:3232 \
            -e ENABLE_DIDCOMM=false \
            -e TR_STORAGE_BACKEND=csv \
            -e FILE_STORAGE_PATH=/app/sample-data/data.csv \
            trust-registry:ci
          if ! timeout 120 bash -c 'until curl -fsS http://127.0.0.1:3232/health; do sleep 2; done'; then
            docker logs tr
            exit 1
          fi
          # The image's own HEALTHCHECK agrees.
          docker exec tr /usr/local/bin/trust-registry-healthcheck
      - name: Stop it
        if: always()
        run: docker rm -f tr || true
  test:
    name: Test Suite
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    # The Redis and DynamoDB storage adapters' tests (conformance suite
    # included) run only when TR_TEST_REDIS_URL / TR_TEST_DYNAMODB_ENDPOINT are
    # set. Redis database 15 keeps them apart from anything else; the DynamoDB
    # tests create their table in LocalStack if it is missing.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      localstack:
        # The image docker-compose.yaml uses.
        image: localstack/localstack:3.6.0
        ports:
          - 4566:4566
        env:
          SERVICES: dynamodb
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      # Read by trust-registry/tests/didcomm_integration_test.rs (longer waits).
      IN_PIPELINE: 'true'
      MEDIATOR_DID: ${{ vars.MEDIATOR_DID }}
      TR_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      TR_TEST_DYNAMODB_ENDPOINT: http://127.0.0.1:4566
      TR_TEST_DYNAMODB_TABLE: trust-registry-conformance
      # Fail, rather than skip, a storage test whose service variable is unset.
      TR_TEST_REQUIRE_SERVICES: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # No `ref:`: a pull_request run tests the PR merged into its base
        # (from a fork too); a push run tests the pushed commit.
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ''
          toolchain: '1.96.0'
          override: true
      - uses: affinidi/pipeline-rust/.github/actions/rust-dependencies@2bbccfe101c0261cc9ee2252383bc62cb00cd469 # main, 2026-11-09
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: 'rust-cache'
      - name: generate configs
        run: |
          # The tests run as the test identities in .env.test; the registry
          # identity this also writes to .env is replaced by `cp .env.test .env`.
          cargo run --bin setup-trust-registry --features dev-tools -p trust-registry -- \
            --mediator-did="$MEDIATOR_DID" \
            --did-method=peer \
            --with-test-identities \
            --test-in-pipeline \
            --non-interactive \
            --file-storage-path=trust-registry/tests/tmp/data.csv
      - name: Prepare test data
        run: |
          mkdir -p trust-registry/tests/tmp
          cp sample-data/data.csv trust-registry/tests/tmp/data.csv
      - name: Run trust-registry server
        run: |
          # setup-trust-registry wrote the generated keys to .env.test
          # (from the tracked .env.pipeline template).
          cp .env.test .env
          RUST_LOG=info nohup cargo run --bin trust-registry > server.log 2>&1 &
          echo $! > server.pid
      - name: Wait for server to be ready
        run: |
          timeout 240 bash -c 'until curl -f http://127.0.0.1:3233/health 2>/dev/null; do sleep 2; done' || (
            echo "Server failed to start. Logs:"
            cat server.log
            exit 1
          )
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-llvm-cov
      - name: Generate code coverage
        run: |
          tail -n +1 -f server.log &
          TAIL_PID=$!
          trap 'kill $TAIL_PID 2>/dev/null || true' EXIT
          cargo llvm-cov --all-features -p trust-registry --summary-only --fail-under-lines=45
      - name: Test library crates
        run: cargo test --all-features -p trql-client -p trqp
      - name: Test the test-trust-registry fixture
        run: |
          cargo test -p test-trust-registry
          # Its `mediator` / `tsp` suites need a Redis for the test mediator
          # and run in ignored-tests.yml (nightly); build them here so they
          # cannot rot.
          cargo test -p test-trust-registry --features mediator,tsp --no-run
      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi
