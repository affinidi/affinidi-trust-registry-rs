name: Update the release schedule

# Regenerates RELEASES.md's schedule table on main from the v* tags
# (scripts/release_schedule.py) and opens, or updates, the PR that commits it
# (RELEASES.md, "Schedule update"). Runs after every successful "Tag a
# release" (the cut's rc.0, an rc, a GA, a patch), and from the Actions tab.
#
# `workflow_run`, not a job in release-tag.yml: a push to release/X.Y runs
# that branch's copy of release-tag.yml, frozen at its cut, while
# `workflow_run` always runs main's copy of this file. Nothing from the
# triggering run is used: this checks out main and reads only the tags.
#
# With the release-bot app's token: the enterprise does not allow
# GITHUB_TOKEN to open PRs, and a PR it opened would run no checks.
on:
  workflow_run:
    workflows: ["Tag a release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-schedule
  cancel-in-progress: false

jobs:
  update:
    name: Update the schedule on main
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # The release-bot app's secrets live in the `release` environment, whose
    # branch policy admits `main` (a workflow_run job runs on main).
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BRANCH: release-schedule
      TITLE: "docs(releases): update the release schedule"
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          filter: 'tree:0'
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
      - name: Regenerate the table
        id: regen
        run: |
          set -euo pipefail
          python3 scripts/release_schedule.py --write
          if git diff --quiet -- RELEASES.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff -- RELEASES.md
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push the branch and open or update the PR
        if: steps.regen.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          # Commit as the app's bot user, signed off (DCO).
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -s -m "$TITLE" -- RELEASES.md
          # The branch belongs to this workflow: it is always main + one commit.
          git push --force origin "$BRANCH"
          body="Generated by \`release-schedule.yml\` (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) from the \`v*\` tags with \`scripts/release_schedule.py --write\`. Until this is merged, the \`release schedule\` check fails on PRs into \`main\`."
          if [ -n "$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[].number')" ]; then
            echo "The open PR now carries the new commit."
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$body"
          fi
