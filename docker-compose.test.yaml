version: "3.9"

services:
  trust-registry:
    image: trust-registry:local
    build:
      context: .
      dockerfile: trust-registry/Dockerfile
    env_file:
      - .env.test
    environment:
      LISTEN_ADDRESS: 0.0.0.0:3232
      FILE_STORAGE_PATH: /app/sample-data/data.csv
    ports:
      - "127.0.0.1:3232:3232"
