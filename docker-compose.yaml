# Published ports are bound to the loopback interface. To reach the registry
# from other machines, change "127.0.0.1:3232:3232" to "3232:3232" deliberately.
services:
  trust-registry:
    image: trust-registry:local
    # Time to drain in-flight requests and DIDComm handlers and send their
    # deletions to the mediator after SIGTERM (up to 75s in the listener).
    stop_grace_period: 90s
    build:
      context: .
      dockerfile: trust-registry/Dockerfile
    env_file:
      - .env
    environment:
      LISTEN_ADDRESS: 0.0.0.0:3232
      FILE_STORAGE_PATH: /sample-data/data.csv
    ports:
      - "127.0.0.1:3232:3232"
    volumes:
      - ./sample-data:/sample-data
  # A local DynamoDB for the dynamodb storage backend. Not started by a plain
  # `docker compose up`; start it with `docker compose --profile dynamodb up`
  # or `docker compose up localstack`.
  localstack:
    image: localstack/localstack:3.6.0
    container_name: localstack
    profiles: ["dynamodb"]
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      - SERVICES=dynamodb
      - DEFAULT_REGION=ap-southeast-1
