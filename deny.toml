# CI runs `cargo deny check bans licenses sources`; advisories are checked by
# cargo-audit, which takes its ignore list from the workflow's `auditIgnore`
# input. This table applies when `cargo deny check advisories` is run.
[advisories]
version = 2
yanked = "deny"
# Any entry here must say why, and by when it is to be reviewed again.
# Keep it in step with `auditIgnore` in .github/workflows/checks.yaml.
ignore = [
  # Accepted 2026-11-17: status-only "unmaintained" advisories with no fixed
  # release and no reported vulnerability. chrono is used directly and arrives
  # again through the affinidi-tdk stack, so it cannot leave the graph from
  # here alone.
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained (chronotope/chrono#1768): status only, no vulnerability, no fixed release. Used directly and through the affinidi-tdk stack. Remove when this workspace and affinidi-tdk-rs have migrated to `jiff` or `time`." },
  { id = "RUSTSEC-2026-0542", reason = "humantime marked unmaintained because chrono is: status only, no vulnerability; humantime 2.4.0 has no dependencies, so chrono's status does not reach it. Remove with RUSTSEC-2026-0543, or when nothing here depends on humantime." },
]

[bans]
# Report duplicate versions so growth in the graph is visible in CI output.
multiple-versions = "warn"
# A dependency must name a version; workspace path dependencies are exempt.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io. A git dependency or another registry must be added here
# deliberately (`allow-git = ["https://github.com/<org>/<repo>"]`).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
# We want really high confidence when inferring licenses from text
confidence-threshold = 0.93
allow = [
    "0BSD",
    "Apache-2.0",
    "BSL-1.0",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT-0",
    "MIT",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
]

exceptions = [
    # changed from: { allow = ["MPL-2.0"], crate = "webpki-root-certs" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
    # dirs 6 -> dirs-sys -> option-ext, reached through vta-sdk. MPL-2.0 is
    # file-level copyleft and we link it unmodified, so it does not reach our
    # own sources.
    { allow = ["MPL-2.0"], crate = "option-ext" },
    # psm 0.1.32's build dependency (psm <- pest_stack_guard <- pest), new with
    # the dependency update. Apache-2.0 with the LLVM linking exception, which
    # only relaxes Apache-2.0's attribution terms for embedded code.
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "ar_archive_writer" },
]

# Sigh
[[licenses.clarify]]
crate = "ring"
# SPDX considers OpenSSL to encompass both the OpenSSL and SSLeay licenses
# https://spdx.org/licenses/OpenSSL.html
# ISC - Both BoringSSL and ring use this for their new files
# MIT - "Files in third_party/ have their own licenses, as described therein. The MIT
# license, for third_party/fiat, which, unlike other third_party directories, is
# compiled into non-test libraries, is included below."
# OpenSSL - Obviously
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]
