[package]
name = "trust-registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
readme.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
repository.workspace = true
publish = true

[dependencies]
axum.workspace = true
affinidi-tdk.workspace = true
trust-tasks-rs.workspace = true
trust-tasks-proof.workspace = true
trust-tasks-https.workspace = true
trust-tasks-didcomm.workspace = true
async-trait.workspace = true
futures.workspace = true
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_derive.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower-http = { workspace = true, features = ["cors"] }
tracing.workspace = true
tracing-subscriber.workspace = true
sha256.workspace = true
uuid.workspace = true
thiserror.workspace = true
reqwest.workspace = true

# --- Optional backends -------------------------------------------------------
# Everything below is gated by a feature so a host embedding the registry as a
# library only compiles the backends it actually uses. All are on by default
# (see `[features]`), so a standalone build is unchanged.
csv = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
aws-types = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }
aws-sdk-dynamodb = { workspace = true, optional = true }
aws-sdk-ssm = { workspace = true, optional = true }
aws-sdk-secretsmanager = { workspace = true, optional = true }
serde_dynamo = { workspace = true, optional = true }
# Only `server::start()` (the standalone entrypoint) reads a `.env` file; an
# embedded registry takes its config from the host.
dotenvy = { workspace = true, optional = true }

didwebvh-rs = { version = "0.6", optional = true }
trust-tasks-tsp = { workspace = true, optional = true }
# Direct optional dep solely to enable the SDK's `tsp` feature (atm.tsp()) on the
# shared affinidi-messaging-sdk instance; affinidi-tdk/tsp only pulls affinidi-tsp.
affinidi-messaging-sdk = { workspace = true, optional = true }
# Pluggable secret-store backends for the TR identity (profile bundle). Backends
# are enabled via the `secrets-*` features below, mirroring vti-secrets.
#
# Optional so a host embedding the registry without a secret store does not pull
# it. That matters beyond build size: `vti-secrets` is a workspace member of
# `verifiable-trust-infrastructure`, so a VTC embedding us would otherwise carry
# both its own path copy and a crates.io copy of this crate (and of
# `vti-common` underneath it) — two copies of the same version from different
# sources.
vti-secrets = { workspace = true, default-features = false, optional = true }
fjall = { workspace = true, optional = true }
vta-sdk = { workspace = true, optional = true, features = ["integration"] }
url = "2.5"
# `setup-trust-registry` only (gated by `dev-tools`).
clap = { version = "4.5", features = ["derive"], optional = true }
crossterm = { version = "0.29", optional = true }
urlencoding = "2.1.3"

[dev-dependencies]
tempfile.workspace = true
serial_test.workspace = true
tower.workspace = true

[[bin]]
name = "trust-registry"
path = "src/main.rs"
# `main` is a one-liner over `server::start()`, which is what `standalone` gates.
required-features = ["standalone"]

[[bin]]
name = "generate-secrets"
path = "bin/generate_secrets.rs"
required-features = ["dev-tools"]

[[bin]]
name = "setup-trust-registry"
path = "bin/setup_trust_registry.rs"
required-features = ["dev-tools"]

[features]
# Everything the standalone service needs. A host embedding the registry as a
# library should build with `default-features = false` and add back only the
# backends it uses — see the "Embedding" section of the README.
default = [
    "secrets-config",
    "storage-csv",
    "storage-ddb",
    "storage-redis",
    "loaders-aws",
    "standalone",
]
# The `setup-trust-registry` / `generate-secrets` binaries. `secrets-config`
# because the setup wizard writes the profile bundle through the secret store.
dev-tools = ["didwebvh-rs", "dep:clap", "dep:crossterm", "secrets-config"]
# Trust Spanning Protocol transport binding. Off by default (affinidi-tsp is a
# moving 0.x dependency); pulls trust-tasks-tsp and enables affinidi-tdk's tsp
# feature (affinidi-tsp + the SDK TspOps accessor).
tsp = [
    "dep:trust-tasks-tsp",
    "dep:affinidi-messaging-sdk",
    "affinidi-tdk/tsp",
    "affinidi-messaging-sdk/tsp",
]

# Secret-store backends for the Trust Registry identity, forwarded to vti-secrets.
# `secrets-config` (config-inline + plaintext file) has no extra dependencies and
# is on by default; cloud/keyring backends are opt-in to keep the default build
# lean, and `secrets-all` turns everything on.
#
# `secrets` is an internal umbrella: it compiles `configs::secret_store` and
# pulls the shared implementation crate. Every `secrets-*` turns it on; nothing
# else should name it directly. With none of them the registry has no secret
# store at all — the right shape for a host that supplies the identity itself.
secrets = ["dep:vti-secrets"]
secrets-config = ["secrets", "vti-secrets/config-seed"]

# Storage backends for trust records. Exactly the ones you enable are compiled;
# `TR_STORAGE_BACKEND` selecting a backend that was not compiled in is a startup
# error naming the missing feature, not a silent fallback.
#
# `LocalStorage` (in-memory) has no dependencies and is always available — it is
# the zero-config choice for tests and for a host that keeps its own mirror.
#
# Embedded fjall LSM store. No external service; the natural pick when embedding.
storage-fjall = ["dep:fjall"]
# CSV file store — the default backend for the standalone service.
storage-csv = ["dep:csv"]
# DynamoDB store.
storage-ddb = [
    "dep:aws-types",
    "dep:aws-config",
    "dep:aws-sdk-dynamodb",
    "dep:serde_dynamo",
]
# Redis store.
storage-redis = ["dep:redis"]

# `aws_secrets://` and `aws_parameter_store://` config-loader URI schemes. With
# this off, those schemes are rejected with a message naming the feature; the
# dependency-free `string://` and `file://` schemes always work.
loaders-aws = ["dep:aws-config", "dep:aws-sdk-ssm", "dep:aws-sdk-secretsmanager"]

# The standalone entrypoint (`server::start()`): `.env` loading, global logging
# init, and `std::process::exit` on listener death. An embedded registry wants
# none of that — the host owns its process — so this is off in a lean build and
# `server::serve()` / the builder API remain available without it.
standalone = ["dep:dotenvy"]
# VTA integration: fetch the TR DID + keys from a Verifiable Trust Agent at startup.
# `secrets-config` because the VTA path caches the fetched bundle through the
# secret store, so it can boot while the VTA is unreachable.
vta = ["dep:vta-sdk", "secrets-config"]
secrets-aws = ["secrets", "vti-secrets/aws-secrets"]
secrets-gcp = ["secrets", "vti-secrets/gcp-secrets"]
secrets-azure = ["secrets", "vti-secrets/azure-secrets"]
secrets-vault = ["secrets", "vti-secrets/vault-secrets"]
secrets-k8s = ["secrets", "vti-secrets/k8s-secrets"]
secrets-keyring = ["secrets", "vti-secrets/keyring"]
secrets-all = [
    "secrets-config",
    "secrets-aws",
    "secrets-gcp",
    "secrets-azure",
    "secrets-vault",
    "secrets-k8s",
    "secrets-keyring",
]

[lints]
workspace = true
