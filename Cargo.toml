[workspace]
members = [
  "test-client",
  "test-trust-registry",
  "trust-registry",
  "trql-client",
  "trqp",
]
resolver = "3"

[workspace.package]
version = '0.17.0'
edition = "2024"
publish = true
rust-version = "1.95.0"
description = "Trust Registry"
readme = "README.md"
license = "Apache-2.0"
keywords = ["ssi", "affinidi", "trqp", "trql", "trust-registry"]
repository = "https://github.com/affinidi/affinidi-trust-registry-rs"
homepage = "https://affinidi.com/"

[workspace.dependencies]

affinidi-tdk = "0.13"
# Must track the affinidi-messaging-sdk that affinidi-tdk itself pulls in. This
# dep exists only to switch on the SDK's `tsp` feature, and a feature only
# unifies within one semver-compatible copy — a mismatched major/minor silently
# gives two SDKs, and the feature lands on the one tdk does *not* re-export.
affinidi-messaging-sdk = "0.23"
trust-tasks-rs = "0.19.4"
trust-tasks-proof = "0.19.4"
vti-secrets = { version = "0.3", default-features = false }
fjall = "3"
vta-sdk = { version = "0.35", default-features = false }
trust-tasks-https = { version = "0.19.4", default-features = false }
trust-tasks-tsp = "0.19.4"
trust-tasks-didcomm = "0.19.4"
anyhow = "1.0"
async-trait = "0.1.92"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.4.0"
dotenvy = "0.15.7"
axum = "0.8.9"
futures = "0.3"
tokio = { version = "1.53", features = ["full"] }
tokio-util = "0.7"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "env-filter",
] }
tempfile = "3.27"
serde = "1.0.229"
thiserror = "2.0"
serde_derive = { version = "1.0" }
serde_json = { version = "1.0" }
sha256 = "1.6"
once_cell = "1.21"
axum-server = { version = "0.8", default-features = true }
tower-http = { version = "0.7", features = ["cors", "trace", "limit"] }
uuid = { version = "1.26", features = ["v4"] }
aws-types = { version = "1.6" }
# `default-features = false` on the three AWS service clients, because their
# default `rustls` feature is the only thing dragging the legacy HTTP stack in:
#
#   aws-sdk-*/rustls -> aws-smithy-runtime/tls-rustls
#                    -> aws-smithy-runtime/connector-hyper-0-14-x
#                    -> aws-smithy-http-client/hyper-014
#                    -> hyper 0.14 + h2 0.3.x + rustls 0.21 + rustls-webpki 0.101.7
#
# `h2-0-3` is an *optional* dependency of `aws-smithy-http-client` gated behind
# `hyper-014`, so declining it removes the vulnerable crates from the graph
# rather than suppressing advisories against them. Their default set is
# ["rustls", "default-https-client", "rt-tokio"], so naming the latter two
# drops the legacy connector and nothing else.
#
# `aws-config` is deliberately left on its defaults: they are
# ["default-https-client", "rt-tokio", "credentials-process", "sso"] with no
# `rustls`, so it never contributed to the problem, and disabling them would
# quietly remove AWS SSO and `credential_process` credential resolution.
#
# `behavior-version-latest` is not enabled anywhere here: every call site names
# its own `BehaviorVersion` explicitly.
aws-config = { version = "1.12" }
aws-sdk-dynamodb = { version = "1.124", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-ssm = { version = "1.122", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-secretsmanager = { version = "1.115", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
serde_dynamo = { version = "4.3", features = ["aws-sdk-dynamodb+1"] }
redis = { version = "1.7", features = ["tokio-comp", "connection-manager"] }

# Test dependencies
reqwest = { version = "0.13", features = ["json"] }
serial_test = "4.0"
tower = { version = "0.5", features = ["util"] }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
