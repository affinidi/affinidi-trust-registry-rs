[workspace]
members = [
  "test-client",
  "test-trust-registry",
  "trust-registry",
  "trql-client",
  "trqp",
]
resolver = "3"

[workspace.package]
version = '0.14.0'
edition = "2024"
publish = true
rust-version = "1.95.0"
description = "Trust Registry"
readme = "README.md"
license = "Apache-2.0"
keywords = ["ssi", "affinidi", "trqp", "trql", "trust-registry"]
repository = "https://github.com/affinidi/affinidi-trust-registry-rs"
homepage = "https://affinidi.com/"

[workspace.dependencies]

affinidi-tdk = "0.8"
# Must track the affinidi-messaging-sdk that affinidi-tdk itself pulls in. This
# dep exists only to switch on the SDK's `tsp` feature, and a feature only
# unifies within one semver-compatible copy — a mismatched major/minor silently
# gives two SDKs, and the feature lands on the one tdk does *not* re-export.
affinidi-messaging-sdk = "0.19"
trust-tasks-rs = "0.9"
trust-tasks-proof = "0.9"
vti-secrets = { version = "0.1", default-features = false }
fjall = "3"
vta-sdk = { version = "0.25", default-features = false }
trust-tasks-https = { version = "0.9", default-features = false }
trust-tasks-tsp = "0.9"
trust-tasks-didcomm = "0.9"
anyhow = "1.0"
async-trait = "0.1.89"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.4.0"
dotenvy = "0.15.7"
axum = "0.8.7"
futures = "0.3"
tokio = { version = "1.48", features = ["full"] }
tokio-util = "0.7"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "env-filter",
] }
tempfile = "3.23"
serde = "1.0.228"
thiserror = "2.0"
serde_derive = { version = "1.0" }
serde_json = { version = "1.0" }
sha256 = "1.6"
once_cell = "1.21"
axum-server = { version = "0.8", default-features = true }
tower-http = { version = "0.7", features = ["cors", "trace", "limit"] }
uuid = { version = "1.19", features = ["v4"] }
aws-types = { version = "1.3" }
aws-config = { version = "1.8" }
# default-features off: their "rustls" default feature pulls aws-smithy-runtime's
# legacy hyper-0.14 connector (tls-rustls -> connector-hyper-0-14-x), which drags
# in an unpatched h2 0.3.x (RUSTSEC-2026-0258, no fix on the 0.3 line). We only
# need the modern hyper-1.x/rustls client, so re-enable just that plus rt-tokio.
aws-sdk-dynamodb = { version = "1.104", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
aws-sdk-ssm = { version = "1.103", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
aws-sdk-secretsmanager = { version = "1.99", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
serde_dynamo = { version = "4.3", features = ["aws-sdk-dynamodb+1"] }
redis = { version = "1.0.3", features = ["tokio-comp", "connection-manager"] }

# Test dependencies
reqwest = { version = "0.13", features = ["json"] }
serial_test = "4.0"
tower = { version = "0.5", features = ["util"] }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
