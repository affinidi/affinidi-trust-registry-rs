[workspace]
members = [
  "test-client",
  "test-trust-registry",
  "trust-registry",
  "trql-client",
  "trqp",
]
resolver = "3"

[workspace.package]
version = "0.29.0"
edition = "2024"
publish = true
rust-version = "1.95.0"
description = "Trust Registry"
readme = "README.md"
license = "Apache-2.0"
keywords = ["ssi", "affinidi", "trqp", "trql", "trust-registry"]
repository = "https://github.com/affinidi/affinidi-trust-registry-rs"
homepage = "https://affinidi.com/"

[workspace.dependencies]

affinidi-tdk = "0.32.0"
# Must track the affinidi-messaging-sdk that affinidi-tdk itself pulls in. This
# dep exists only to switch on the SDK's `tsp` feature, and a feature only
# unifies within one semver-compatible copy — a mismatched major/minor silently
# gives two SDKs, and the feature lands on the one tdk does *not* re-export.
#
# 0.18 -> 0.20 (SDK 0.28.1 -> 0.30.0, trust-tasks-rs 0.23.4 -> 0.24.2, vta-sdk
# 0.54 -> 0.56) is the VTI/TDK stack move: vta-sdk 0.56 is the release that
# declares `affinidi-tdk ^0.20`, `affinidi-messaging-sdk ^0.30` and
# `trust-tasks-rs ^0.24.2`, so all three move in this same commit.
#
# 0.22 -> 0.24 (SDK 0.32 -> 0.34.1, trust-tasks 0.26 -> 0.28, vta-sdk 0.61 ->
# 0.65) is the same kind of move: vta-sdk 0.65 declares all three.
#
# 0.24 -> 0.26 (SDK 0.34 -> 0.36, trust-tasks 0.28 -> 0.31, vta-sdk 0.65 ->
# 0.68) again: vta-sdk 0.68 declares all three.
#
# 0.26 -> 0.27 (SDK 0.36 -> 0.37, trust-tasks 0.31 -> 0.32, vta-sdk 0.69 ->
# 0.72) the same again: vta-sdk 0.72 declares all three.
#
# 0.27 -> 0.32 (SDK 0.37 -> 0.40, trust-tasks 0.32 -> 0.34, vta-sdk 0.72 ->
# 0.73) the same again: vta-sdk 0.73 declares all three.
affinidi-messaging-sdk = "0.40.0"
# The D1 delivery layer + its neutral transport types. Used by the messaging
# module to drive inbound off `MessagingService::subscribe` (which surfaces the
# TSP relationship-control distinction the registry needs for Rev 3 §7.2.2) and
# to back a durable outbox. Same major/minor line the VTA and mediator ship, so
# the SDK's `DidCommTransport` (which implements `MessageTransport`) unifies.
affinidi-messaging-delivery = "0.1.20"
affinidi-messaging-core = "0.1.11"
trust-tasks-rs = { git = "https://github.com/trustoverip/dtgwg-trust-tasks-tf", rev = "62a1dfd311" }
trust-tasks-proof = { git = "https://github.com/trustoverip/dtgwg-trust-tasks-tf", rev = "62a1dfd311" }
vti-secrets = { version = "0.22.0", default-features = false }
fjall = "3"
vta-sdk = { version = "0.73.0", default-features = false }
trust-tasks-https = { git = "https://github.com/trustoverip/dtgwg-trust-tasks-tf", rev = "62a1dfd311", default-features = false }
trust-tasks-tsp = { git = "https://github.com/trustoverip/dtgwg-trust-tasks-tf", rev = "62a1dfd311" }
trust-tasks-didcomm = { git = "https://github.com/trustoverip/dtgwg-trust-tasks-tf", rev = "62a1dfd311" }
# The trust-tasks line the messaging SDK and vta-sdk are built on (^0.34).
# The registry's own trust-tasks crates are newer (they carry the registry/*
# lowerCamelCase specs), and Rust treats 0.34 and 0.35 as different crates, so
# a value handed to the SDK has to be built from the SDK's copy. Only
# `mediator_acl.rs` does that. Remove this once affinidi-messaging-sdk and
# vta-sdk release on the registry's trust-tasks line.
trust-tasks-rs-sdk = { package = "trust-tasks-rs", version = "0.34.1" }
anyhow = "1.0"
async-trait = "0.1.92"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.4.0"
# RFC 3986 URI-reference parsing for TRQP identifier validation.
fluent-uri = "0.4.1"
dotenvy = "0.15.7"
axum = "0.8.9"
futures = "0.3"
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = "0.7"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "env-filter",
] }
tempfile = "3.27"
serde = "1.0.229"
thiserror = "2.0"
serde_derive = { version = "1.0" }
serde_json = { version = "1.0" }
sha256 = "1.6"
once_cell = "1.21"
axum-server = { version = "0.8", default-features = true }
tower-http = { version = "0.7", features = ["cors", "trace", "limit"] }
uuid = { version = "1.28", features = ["v4"] }
aws-types = { version = "1.6" }
# `default-features = false` on the three AWS service clients, because their
# default `rustls` feature is the only thing dragging the legacy HTTP stack in:
#
#   aws-sdk-*/rustls -> aws-smithy-runtime/tls-rustls
#                    -> aws-smithy-runtime/connector-hyper-0-14-x
#                    -> aws-smithy-http-client/hyper-014
#                    -> hyper 0.14 + h2 0.3.x + rustls 0.21 + rustls-webpki 0.101.7
#
# `h2-0-3` is an *optional* dependency of `aws-smithy-http-client` gated behind
# `hyper-014`, so declining it removes the vulnerable crates from the graph
# rather than suppressing advisories against them. Their default set is
# ["rustls", "default-https-client", "rt-tokio"], so naming the latter two
# drops the legacy connector and nothing else.
#
# `aws-config` is deliberately left on its defaults: they are
# ["default-https-client", "rt-tokio", "credentials-process", "sso"] with no
# `rustls`, so it never contributed to the problem, and disabling them would
# quietly remove AWS SSO and `credential_process` credential resolution.
#
# `behavior-version-latest` is not enabled anywhere here: every call site names
# its own `BehaviorVersion` explicitly.
aws-config = { version = "1.12" }
aws-sdk-dynamodb = { version = "1.124", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-ssm = { version = "1.122", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-secretsmanager = { version = "1.115", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
serde_dynamo = { version = "4.3", features = ["aws-sdk-dynamodb+1"] }
redis = { version = "1.7", features = ["tokio-comp", "connection-manager"] }

# Test dependencies
reqwest = { version = "0.13", features = ["json"] }
serial_test = "4.0"
tower = { version = "0.5", features = ["util"] }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
